<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Present Continuous: Happening Now — English</title>
    <meta
      name="description"
      content="Interactive learning media that guides learners to discover for themselves when English uses am/is/are + verb-ing for an action in progress and when it uses the plain verb for a routine, how the -ing is spelled, and how the same sentence turns into a negative and into a question — ending in a live broadcast the learners script and read aloud themselves."
    />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a href="#konten-utama" class="skip-link">Skip to main content</a>

    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__kicker">English</span>
        <h1 class="app-header__title">Present Continuous: Happening Now</h1>
      </div>
      <div class="app-header__actions">
        <button type="button" id="resetAppBtn" class="btn btn--ghost btn--small">Reset</button>
        <a href="../index.html" class="btn btn--ghost btn--small">Home</a>
      </div>
    </header>

    <nav class="stage-nav" aria-label="Learning stages">
      <ol class="stage-nav__list" id="stageNavList">
        <!-- Rendered by app.js -->
      </ol>
    </nav>

    <main id="konten-utama">
      <div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span id="progressLabel">0 of 9 stages completed</span>
          <span style="font-size: 0.78rem; color: var(--color-ink-muted)">
            Progress is saved automatically
          </span>
        </div>
        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Learning progress"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar__fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <div id="stageContainer">
        <p style="text-align: center; padding: var(--space-7); color: var(--color-ink-muted)">
          Loading the learning media…
        </p>
      </div>
    </main>

    <div class="app-notice" id="appNotice" role="status" aria-live="polite"></div>
    <!-- Reset confirmation modal -->
    <div
      class="modal-backdrop"
      id="resetModal"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resetModalTitle"
    >
      <div class="modal">
        <h3 id="resetModalTitle">Reset your progress?</h3>
        <p>
          All of your progress, answers, and notes in this module will be erased. This cannot be
          undone.
        </p>
        <div class="btn-group btn-group--end">
          <button type="button" class="btn btn--ghost" id="resetCancelBtn">Cancel</button>
          <button type="button" class="btn btn--danger" id="resetConfirmBtn">Yes, reset</button>
        </div>
      </div>
    </div>
    <script src="../shared/engine.js"></script>
    <script src="data.js"></script>

    <script src="app.js"></script>
  </body>
</html>
